services:
  api:
    build:
      context: .
      dockerfile: src/MyCollection.Api/Dockerfile
      secrets:
        - sixlabors_license
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING:?MONGO_CONNECTION_STRING is required}
      Mongo__Database: mycollection
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: mycollection
      Jwt__Audience: mycollection-web
      SecretProtection__Key: ${SECRET_PROTECTION_KEY:?SECRET_PROTECTION_KEY is required}
      Storage__Provider: Local
      Storage__LocalRoot: /app/data/media
      # IGDB 為選配：留空即停用整組功能，前端會隱藏搜尋入口。
      # 走 Twitch client credentials（server-to-server），不需要 HTTPS 或重新導向網址。
      Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: http://localhost:8080
    volumes:
      - ./data/media:/app/data/media
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://localhost:5080
    ports:
      - "8080:8080"

secrets:
  # 只在建置 API image 時使用，不會進入 image
  sixlabors_license:
    environment: SIXLABORS_LICENSE_KEY
